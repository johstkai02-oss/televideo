<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeleEmisora en Vivo</title>
<style>
  body { background: #070b12; color: #e2e8f0; font-family: monospace; display: flex; justify-content: center; padding: 35px 15px 15px; margin: 0; }
  .panel { border: 1.5px solid #ef4444; border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; background: #0d131f; }
  h2 { color: #f87171; text-align: center; font-size: 15px; margin-top: 0; }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid #334155; border-radius: 10px; display: block; margin-bottom: 12px; object-fit: cover; }
  .id-box { background: #162032; border: 1px dashed #4ade80; border-radius: 8px; padding: 10px; text-align: center; font-size: 13px; margin-bottom: 12px; color: #86efac; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #162032; color: #fff; margin-bottom: 10px; font-family: inherit; text-align: center; font-size: 15px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; color: #fff; cursor: pointer; }
  .btn-live { background: #dc2626; }
  .btn-watch { background: #2563eb; }
  .log { background: #05080e; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; font-size: 11px; color: #cbd5e1; }
</style>
</head>
<body>
<div class="panel">
  <h2>📺 TELE-EMISORA EN VIVO</h2>
  <video id="tvScreen" autoplay playsinline></video>
  <div class="id-box">ESTADO: <b id="myId">LISTO PARA CONECTAR</b></div>
  <input type="text" id="canalInput" value="CANAL-1" placeholder="Nombre del canal (ej. CANAL-1)">
  <div class="grid">
    <button class="btn-live" onclick="iniciarEmision()">🎥 TRANSMITIR VIVO</button>
    <button class="btn-watch" onclick="verCanal()">📡 SINTONIZAR CANAL</button>
  </div>
  <div class="log" id="logBox">> Pon el mismo nombre de canal (ej. CANAL-1) en ambos dispositivos.</div>
</div>
<script type="module">
import { joinRoom } from 'https://esm.sh/trystero@0.20.0';
const videoEl = document.getElementById('tvScreen');
const log = (t) => document.getElementById('logBox').innerHTML = `> ${t}`;
let room = null, localStream = null;

function conectarSala() {
  const canal = document.getElementById('canalInput').value.trim().toUpperCase() || 'CANAL-1';
  if (room) room.leave();
  room = joinRoom({ appId: 'johstkai02-televideo-live' }, canal);
  document.getElementById('myId').textContent = `SALA ${canal} ACTIVA`;
  room.onPeerStream((stream) => {
    videoEl.srcObject = stream;
    videoEl.muted = false;
    log(`¡Recibiendo señal en vivo del ${canal}!`);
  });
  return canal;
}

window.iniciarEmision = async () => {
  try {
    const canal = conectarSala();
    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
    videoEl.srcObject = localStream;
    videoEl.muted = true;
    room.addStream(localStream);
    room.onPeerJoin(() => room.addStream(localStream));
    log(`EN VIVO en ${canal}: Abre el otro dispositivo y toca Sintonizar.`);
  } catch (e) { log("Error: Permite el acceso a cámara y micrófono."); }
};

window.verCanal = () => {
  const canal = conectarSala();
  log(`Sintonizando ${canal}... Esperando señal del emisor.`);
};
</script>
</body>
</html>
